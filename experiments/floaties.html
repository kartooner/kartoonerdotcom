<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nebula Floaties</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #02050a; 
            font-family: 'Pixelify Sans', sans-serif;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-root {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; pointer-events: none;
            background: rgba(2, 5, 10, 0.4);
            transition: opacity 1s ease;
        }

        #menu {
            pointer-events: auto; text-align: center; padding: 2rem;
        }
        
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) rotate(-0.5deg); }
            50% { transform: translateY(-15px) rotate(0.5deg); }
        }

        .title {
            font-size: clamp(3rem, 12vw, 7.5rem); 
            font-weight: 600; 
            color: #fff; 
            line-height: 0.9; 
            margin-bottom: 3.5rem;
            text-shadow: 0 0 30px rgba(255, 170, 0, 0.8), 0 0 60px rgba(0, 242, 255, 0.5);
            animation: floatTitle 8s ease-in-out infinite;
            display: block;
        }

        #btn-play {
            background: transparent; border: 3px solid #00ffcc; color: #00ffcc;
            padding: 1.25rem 5rem; font-size: 2rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.15em; cursor: pointer;
            border-radius: 4px; transition: all 0.4s ease;
            outline: none;
            font-family: 'Pixelify Sans', sans-serif;
        }
        #btn-play:focus {
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.5);
            background: rgba(0, 255, 204, 0.05);
        }
        #btn-play:hover {
            background: rgba(0, 255, 204, 0.15);
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.3);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

<div id="ui-root">
    <div id="menu">
        <h1 class="title">Nebula Floaties</h1>
        <button id="btn-play" onclick="startPlay()">Play</button>
    </div>
</div>

<script>
    let scene, camera, renderer, clock;
    let snake, nutrients = [], snow, fgSnow, debris = [], ominousObjects = [], swirls = [];
    let worldSize = 2500;
    let isTouching = false;
    let isPlaying = false;
    
    const touchWorldPos = new THREE.Vector3();
    const dragOffset = new THREE.Vector3();
    const moveVelocity = new THREE.Vector3(0, 0, 1.2);
    const camTarget = new THREE.Vector3();

    const RAINBOW_PALETTE = [0xffaa00, 0x00f2ff, 0xff00cc, 0x00ffaa, 0x7700ff, 0xffcc00];

    function createBackdrop() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 512);
        grad.addColorStop(0, '#3a1a00'); 
        grad.addColorStop(0.3, '#1a0033'); 
        grad.addColorStop(0.6, '#001a44'); 
        grad.addColorStop(1, '#02050a'); 
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);
        return new THREE.CanvasTexture(canvas);
    }

    class Swirl {
        constructor() {
            const geo = new THREE.TorusGeometry(50, 1.2, 8, 32);
            this.mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            }));
            this.mesh.rotation.x = Math.PI / 2;
            this.state = 'hidden';
            this.timer = 0;
            this.life = 4 + Math.random() * 6;
            scene.add(this.mesh);
        }

        update(dt) {
            if (this.state === 'hidden') {
                if (Math.random() < 0.0005) {
                    this.state = 'fadein';
                    this.mesh.position.set((Math.random() - 0.5) * worldSize, -40, (Math.random() - 0.5) * worldSize);
                    this.mesh.scale.setScalar(0.2);
                }
            } else if (this.state === 'fadein') {
                this.mesh.material.opacity += dt * 0.1;
                if (this.mesh.material.opacity >= 0.15) {
                    this.mesh.material.opacity = 0.15;
                    this.state = 'active';
                    this.timer = 0;
                }
            } else if (this.state === 'active') {
                this.timer += dt;
                this.mesh.rotation.z += dt * 1.5;
                this.mesh.scale.setScalar(this.mesh.scale.x + dt * 0.05);
                if (this.timer > this.life) this.state = 'fadeout';
            } else if (this.state === 'fadeout') {
                this.mesh.material.opacity -= dt * 0.1;
                if (this.mesh.material.opacity <= 0) {
                    this.mesh.material.opacity = 0;
                    this.state = 'hidden';
                }
            }
        }
    }

    class Part {
        constructor(radius, color, opacity, order) {
            const geo = new THREE.IcosahedronGeometry(radius, 1);
            this.mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ 
                color: color, 
                transparent: true, 
                opacity: opacity,
                depthTest: false 
            }));
            this.mesh.renderOrder = order; 
            
            const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.1,
                depthTest: false
            }));
            wire.renderOrder = order + 1;
            this.mesh.add(wire);
            this.baseColor = new THREE.Color(color);
            scene.add(this.mesh);
        }
    }

    class Organism {
        constructor() {
            this.nodes = [];
            this.baseSize = 11.0; 
            this.segmentCount = 65;
            this.spacing = 2.5; 
            this.swimSpeed = 1.05;

            const headColor = new THREE.Color(0x00f2ff);
            const tailColor = new THREE.Color(0xffaa00); 

            for (let i = 0; i < this.segmentCount; i++) {
                const pct = i / this.segmentCount;
                const taper = Math.pow(pct, 3.0);
                const r = this.baseSize * (1 - taper * 0.8);
                const color = headColor.clone().lerp(tailColor, pct);
                const node = new Part(r, color, i === 0 ? 1.0 : 0.85, 20000 - i * 10);
                this.nodes.push(node);
                if (i > 0) {
                    node.mesh.position.set(0, 0, -i * this.spacing);
                }
            }

            const jGeo = new THREE.ConeGeometry(this.baseSize * 0.25, this.baseSize * 0.7, 3);
            const jMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, depthTest: false });
            this.lJaw = new THREE.Mesh(jGeo, jMat);
            this.lJaw.position.set(this.baseSize * 0.35, 0, this.baseSize * 0.4);
            this.lJaw.rotation.x = Math.PI / 2;
            this.nodes[0].mesh.add(this.lJaw);
            this.rJaw = this.lJaw.clone();
            this.rJaw.position.x = -this.baseSize * 0.35;
            this.nodes[0].mesh.add(this.rJaw);
        }

        update(t, dt) {
            const head = this.nodes[0].mesh;
            const prevHeadPos = head.position.clone();

            if (isPlaying) {
                if (isTouching) {
                    const target = touchWorldPos.clone().sub(dragOffset);
                    const dist = head.position.distanceTo(target);
                    const maxLeash = 120;
                    if (dist > maxLeash) {
                        const clampedDir = new THREE.Vector3().subVectors(target, head.position).setLength(maxLeash);
                        target.copy(head.position).add(clampedDir);
                    }
                    head.position.lerp(target, 0.15); 
                } else {
                    head.position.add(moveVelocity.clone().multiplyScalar(this.swimSpeed));
                }
            } else {
                head.position.x += Math.sin(t * 0.4) * 0.15;
                head.position.z += Math.cos(t * 0.3) * 0.15;
            }

            const b = worldSize / 2;
            let wrap = new THREE.Vector3();
            if (head.position.x > b) wrap.x = -worldSize;
            else if (head.position.x < -b) wrap.x = worldSize;
            if (head.position.z > b) wrap.z = -worldSize;
            else if (head.position.z < -b) wrap.z = worldSize;

            if (wrap.length() > 0) {
                this.nodes.forEach(n => n.mesh.position.add(wrap));
                camera.position.add(wrap);
                camTarget.add(wrap);
                touchWorldPos.add(wrap);
                dragOffset.add(wrap);
            }

            for (let i = 1; i < this.nodes.length; i++) {
                const lead = this.nodes[i - 1].mesh;
                const follow = this.nodes[i].mesh;
                const d = new THREE.Vector3().subVectors(follow.position, lead.position).normalize();
                follow.position.copy(lead.position).add(d.multiplyScalar(this.spacing));
                const targetRot = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), d.negate());
                follow.quaternion.slerp(targetRot, 0.2);
            }

            const delta = head.position.clone().sub(prevHeadPos);
            if (delta.length() > 0.01) {
                moveVelocity.copy(delta).normalize();
                head.lookAt(head.position.clone().add(moveVelocity));
            }

            const snap = (Math.sin(t * 12) + 1) * 0.5;
            this.lJaw.rotation.z = snap * 0.8;
            this.rJaw.rotation.z = -snap * 0.8;
        }

        grow(n) {
            this.baseSize += n;
            const sc = 1 + (this.baseSize - 11.0) * 0.05;
            this.nodes.forEach(node => node.mesh.scale.setScalar(sc));
            this.spacing = 2.5 * sc;
        }
    }

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        scene.fog = new THREE.FogExp2(0x02050a, 0.00075);
        
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 25000);
        camera.position.set(0, 300, 450); 

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x02050a, 1);
        document.body.appendChild(renderer.domElement);

        const background = new THREE.Mesh(
            new THREE.SphereGeometry(18000, 32, 32),
            new THREE.MeshBasicMaterial({ map: createBackdrop(), side: THREE.BackSide, depthWrite: false })
        );
        scene.add(background);

        const regions = [
            { pos: [1.3, 1.3], col: 0xffaa00 }, { pos: [-1.3, 1.3], col: 0x00f2ff },  
            { pos: [1.3, -1.3], col: 0xff00cc }, { pos: [-1.3, -1.3], col: 0x00ffcc }, 
            { pos: [0, 1.9], col: 0x7700ff }, { pos: [0, -1.9], col: 0xff8800 }     
        ];

        regions.forEach(region => {
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(6000, 16, 16),
                new THREE.MeshBasicMaterial({ color: region.col, transparent: true, opacity: 0.12, depthWrite: false, blending: THREE.AdditiveBlending })
            );
            glow.position.set(region.pos[0] * worldSize, 0, region.pos[1] * worldSize);
            scene.add(glow);
        });

        for(let i = 0; i < 70; i++) {
            const size = 1500 + Math.random() * 3500;
            const cloud = new THREE.Mesh(
                new THREE.SphereGeometry(size, 12, 12),
                new THREE.MeshBasicMaterial({ color: RAINBOW_PALETTE[i % RAINBOW_PALETTE.length], transparent: true, opacity: 0.08, depthWrite: false, blending: THREE.AdditiveBlending })
            );
            cloud.position.set((Math.random()-0.5)*worldSize*9, (Math.random()-0.5)*3500, (Math.random()-0.5)*worldSize*9);
            scene.add(cloud);
        }

        const createSnow = (count, size, opacity, range) => {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(count * 3);
            const cols = new Float32Array(count * 3);
            for(let i=0; i<count; i++) {
                pos[i*3] = (Math.random()-0.5) * worldSize * range;
                pos[i*3+1] = (Math.random()-0.5) * 3500;
                pos[i*3+2] = (Math.random()-0.5) * worldSize * range;
                const c = new THREE.Color(RAINBOW_PALETTE[i % RAINBOW_PALETTE.length]);
                cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
            return new THREE.Points(geo, new THREE.PointsMaterial({ vertexColors: true, size: size, transparent: true, opacity: opacity, depthWrite: false, blending: THREE.AdditiveBlending }));
        };

        snow = createSnow(5000, 6, 0.7, 9);
        scene.add(snow);
        fgSnow = createSnow(400, 25, 0.1, 5);
        scene.add(fgSnow);

        for(let i=0; i<80; i++) {
            const dGeo = new THREE.IcosahedronGeometry(15 + Math.random()*30, 0);
            const dMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.04, depthWrite: false });
            const dMesh = new THREE.Mesh(dGeo, dMat);
            dMesh.position.set((Math.random()-0.5)*worldSize*5, (Math.random()-0.5)*1200, (Math.random()-0.5)*worldSize*5);
            dMesh.userData.speed = Math.random() * 0.3 + 0.05;
            scene.add(dMesh);
            debris.push(dMesh);
        }

        for(let i=0; i<15; i++) {
            const size = 200 + Math.random() * 400;
            const oGeo = new THREE.IcosahedronGeometry(size, 1);
            const oMat = new THREE.MeshBasicMaterial({ color: 0x050a15, transparent: true, opacity: 0.4, depthWrite: false });
            const oMesh = new THREE.Mesh(oGeo, oMat);
            oMesh.position.set((Math.random()-0.5)*worldSize*4, -800 - Math.random()*500, (Math.random()-0.5)*worldSize*4);
            oMesh.userData.rotSpeed = (Math.random() - 0.5) * 0.001;
            scene.add(oMesh);
            ominousObjects.push(oMesh);
        }

        for(let i=0; i<8; i++) {
            swirls.push(new Swirl());
        }

        snake = new Organism();
        spawnNutrients();

        const rc = new THREE.Raycaster();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        function updateCoords(x, y) {
            const m = new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
            rc.setFromCamera(m, camera);
            rc.ray.intersectPlane(plane, touchWorldPos);
        }

        const handleStart = (e) => {
            if (!isPlaying) return;
            isTouching = true;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            updateCoords(x, y);
            dragOffset.copy(touchWorldPos).sub(snake.nodes[0].mesh.position);
        };
        const handleMove = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            updateCoords(x, y);
        };

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => isTouching = false);
        window.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', (e) => {
            handleMove(e);
            if (isPlaying) e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchend', () => isTouching = false);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function spawnNutrients() {
        for(let i=0; i<300; i++) {
            const b = new THREE.Mesh(
                new THREE.TetrahedronGeometry(12, 0),
                new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 1, depthWrite: false })
            );
            b.position.set((Math.random()-0.5)*worldSize, 0, (Math.random()-0.5)*worldSize);
            b.userData.offset = Math.random() * 6.28;
            b.userData.rotSpeed = (Math.random() - 0.5) * 0.04;
            scene.add(b);
            nutrients.push(b);
        }
    }

    function startPlay() {
        document.getElementById('ui-root').style.opacity = '0';
        setTimeout(() => { 
            document.getElementById('ui-root').style.display = 'none'; 
            isPlaying = true; 
        }, 1000);
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const dt = Math.min(clock.getDelta(), 0.1); 

        if (snake) snake.update(t, dt);

        if (camera && snake) {
            const headPos = snake.nodes[0].mesh.position;
            const h = 280 + (snake.baseSize * 4);
            const d = 320 + (snake.baseSize * 4);
            const desiredCamPos = headPos.clone().add(new THREE.Vector3(0, h, d));
            
            camera.position.lerp(desiredCamPos, 0.15);
            camTarget.lerp(headPos, 0.2);
            camera.lookAt(camTarget);
        }

        if (snow) snow.rotation.y += 0.0004;
        if (fgSnow) fgSnow.rotation.y += 0.0012;

        debris.forEach(d => {
            d.position.y += Math.sin(t * d.userData.speed) * 0.25;
            d.rotation.x += 0.008;
        });

        ominousObjects.forEach(o => {
            o.rotation.y += o.userData.rotSpeed;
            o.position.x += Math.sin(t * 0.05) * 0.04;
        });

        swirls.forEach(s => s.update(dt));

        nutrients.forEach((f) => {
            f.position.y = Math.sin(t * 1.5 + f.userData.offset) * 8;
            f.rotation.y += f.userData.rotSpeed;
            if (isPlaying && snake && f.position.distanceTo(snake.nodes[0].mesh.position) < snake.baseSize + 18.0) {
                f.position.set((Math.random()-0.5)*worldSize, 0, (Math.random()-0.5)*worldSize);
                snake.grow(0.5);
            }
        });

        if (renderer && scene && camera) renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
