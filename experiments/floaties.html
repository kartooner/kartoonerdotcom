<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nebula Floaties</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #01050a; 
            font-family: 'Press Start 2P', cursive;
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-root {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; pointer-events: none;
            background: rgba(1, 5, 10, 0.3);
            transition: opacity 1s ease;
        }

        #menu {
            pointer-events: auto; text-align: center; padding: 2rem;
        }
        
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .title {
            font-size: clamp(2rem, 10vw, 5rem); 
            color: #fff; 
            line-height: 1.2; 
            margin-bottom: 4rem;
            text-shadow: 6px 6px 0px #ffaa00, 12px 12px 0px rgba(0, 242, 255, 0.4);
            animation: floatTitle 6s ease-in-out infinite;
            display: block;
        }

        #btn-play {
            background: transparent; border: 4px solid #00ffcc; color: #00ffcc;
            padding: 1.5rem 4rem; font-size: 1.2rem; cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
            font-family: 'Press Start 2P', cursive;
            box-shadow: 4px 4px 0px #000;
        }
        #btn-play:hover {
            background: #00ffcc;
            color: #01050a;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000;
        }
        #btn-play:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
    </style>
</head>
<body>

<div id="ui-root">
    <div id="menu">
        <h1 class="title">Nebula Floaties</h1>
        <button id="btn-play" onclick="startPlay()">PLAY</button>
    </div>
</div>

<script>
    let scene, camera, renderer, clock;
    let snake, nutrients = [], snow, nebulaClouds = [];
    let worldSize = 2500;
    let isTouching = false;
    let isPlaying = false;
    
    let touchWorldPos = new THREE.Vector3();
    let dragOffset = new THREE.Vector3();
    let moveDir = new THREE.Vector3(0, 0, 1);
    let camFocalPoint = new THREE.Vector3();

    const COLORS = [0xffaa00, 0x00f2ff, 0xff00cc, 0x00ffaa, 0x7700ff, 0xff5500];

    function createBackdrop() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 512);
        grad.addColorStop(0, '#3a1a00'); 
        grad.addColorStop(0.3, '#1a0033'); 
        grad.addColorStop(0.6, '#001a44'); 
        grad.addColorStop(1, '#01050a'); 
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);
        return new THREE.CanvasTexture(canvas);
    }

    class Organism {
        constructor() {
            this.nodes = [];
            this.baseSize = 9.5; 
            this.segmentCount = 50;
            this.spacing = 2.4; 
            this.swimSpeed = 1.0;

            const headColor = new THREE.Color(0x00f2ff);
            const tailColor = new THREE.Color(0xffaa00); 

            for (let i = 0; i < this.segmentCount; i++) {
                const pct = i / this.segmentCount;
                const r = this.baseSize * (1 - pct * 0.88);
                const col = headColor.clone().lerp(tailColor, pct);
                
                const geo = new THREE.IcosahedronGeometry(r, 1);
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ 
                    color: col, transparent: true, opacity: i === 0 ? 1 : 0.8, depthTest: false 
                }));
                mesh.renderOrder = 20000 - i;
                
                const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ 
                    color: 0xffffff, wireframe: true, transparent: true, opacity: 0.2, depthTest: false 
                }));
                mesh.add(wire);
                
                if (i > 0) mesh.position.set(0, 0, -i * this.spacing);
                scene.add(mesh);
                this.nodes.push(mesh);
            }

            const jGeo = new THREE.ConeGeometry(this.baseSize * 0.2, this.baseSize * 0.6, 3);
            const jMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, depthTest: false });
            this.lJaw = new THREE.Mesh(jGeo, jMat);
            this.lJaw.position.set(this.baseSize * 0.3, 0, this.baseSize * 0.4);
            this.lJaw.rotation.x = Math.PI/2;
            this.nodes[0].add(this.lJaw);
            this.rJaw = this.lJaw.clone();
            this.rJaw.position.x = -this.baseSize * 0.3;
            this.nodes[0].add(this.rJaw);
        }

        update(t, isTouching, touchPos, offset, isPlaying) {
            const head = this.nodes[0];
            const prevPos = head.position.clone();

            if (isPlaying) {
                if (isTouching) {
                    const target = touchPos.clone().sub(offset);
                    // 1:1 follow with a smooth lerp to keep it liquid
                    head.position.lerp(target, 0.2); 
                } else {
                    head.position.add(moveDir.clone().multiplyScalar(this.swimSpeed));
                }
            }

            // Wrap logic
            const b = worldSize / 2;
            let wrap = new THREE.Vector3();
            if (head.position.x > b) wrap.x = -worldSize;
            else if (head.position.x < -b) wrap.x = worldSize;
            if (head.position.z > b) wrap.z = -worldSize;
            else if (head.position.z < -b) wrap.z = worldSize;

            if (wrap.length() > 0) {
                this.nodes.forEach(n => n.position.add(wrap));
                return wrap;
            }

            // Body Chain
            for (let i = 1; i < this.nodes.length; i++) {
                const lead = this.nodes[i - 1];
                const follow = this.nodes[i];
                const d = new THREE.Vector3().subVectors(follow.position, lead.position).normalize();
                follow.position.copy(lead.position).add(d.multiplyScalar(this.spacing));
                const targetRot = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), d.negate());
                follow.quaternion.slerp(targetRot, 0.2);
            }

            const delta = head.position.clone().sub(prevPos);
            if (delta.length() > 0.01) {
                moveDir.copy(delta).normalize();
                const headRot = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,0,1), moveDir);
                head.quaternion.slerp(headRot, 0.2);
            }

            const snap = (Math.sin(t * 12) + 1) * 0.5;
            this.lJaw.rotation.z = snap * 0.8;
            this.rJaw.rotation.z = -snap * 0.8;
            return null;
        }
    }

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        scene.fog = new THREE.FogExp2(0x01050a, 0.0006);
        
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(0, 300, 450);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const background = new THREE.Mesh(
            new THREE.SphereGeometry(18000, 32, 32),
            new THREE.MeshBasicMaterial({ map: createBackdrop(), side: THREE.BackSide, depthWrite: false })
        );
        scene.add(background);

        // Rainbow Regions (Project Hail Mary style)
        const regions = [
            { pos: [1.3, 1.3], col: 0xffaa00 }, { pos: [-1.3, 1.3], col: 0x00f2ff },  
            { pos: [1.3, -1.3], col: 0xff00cc }, { pos: [-1.3, -1.3], col: 0x00ffcc }, 
            { pos: [0, 1.9], col: 0x7700ff }, { pos: [0, -1.9], col: 0xff8800 }     
        ];
        regions.forEach(r => {
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(5000, 16, 16),
                new THREE.MeshBasicMaterial({ color: r.col, transparent: true, opacity: 0.18, depthWrite: false, blending: THREE.AdditiveBlending })
            );
            glow.position.set(r.pos[0] * worldSize, 0, r.pos[1] * worldSize);
            scene.add(glow);
        });

        // Blended Clouds
        for(let i = 0; i < 70; i++) {
            const cloud = new THREE.Mesh(
                new THREE.SphereGeometry(1500 + Math.random() * 3000, 12, 12),
                new THREE.MeshBasicMaterial({ color: COLORS[i % COLORS.length], transparent: true, opacity: 0.1, depthWrite: false, blending: THREE.AdditiveBlending })
            );
            cloud.position.set((Math.random()-0.5)*worldSize*8, (Math.random()-0.5)*3000, (Math.random()-0.5)*worldSize*8);
            scene.add(cloud);
        }

        const snowGeo = new THREE.BufferGeometry();
        const snowCount = 3000;
        const snowPos = new Float32Array(snowCount * 3);
        const snowCols = new Float32Array(snowCount * 3);
        for(let i=0; i<snowCount; i++) {
            snowPos[i*3] = (Math.random()-0.5) * worldSize * 8;
            snowPos[i*3+1] = (Math.random()-0.5) * 3000;
            snowPos[i*3+2] = (Math.random()-0.5) * worldSize * 8;
            const c = new THREE.Color(COLORS[i % COLORS.length]);
            snowCols[i*3] = c.r; snowCols[i*3+1] = c.g; snowCols[i*3+2] = c.b;
        }
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        snowGeo.setAttribute('color', new THREE.BufferAttribute(snowCols, 3));
        snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({ vertexColors: true, size: 12, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending }));
        scene.add(snow);

        snake = new Organism();

        const rc = new THREE.Raycaster();
        const plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        const updateCoords = (x, y) => {
            const m = new THREE.Vector2((x / window.innerWidth) * 2 - 1, -(y / window.innerHeight) * 2 + 1);
            rc.setFromCamera(m, camera);
            rc.ray.intersectPlane(plane, touchWorldPos);
        };

        const handleStart = (e) => {
            if (!isPlaying) return;
            isTouching = true;
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            updateCoords(x, y);
            dragOffset.copy(touchWorldPos).sub(snake.nodes[0].position);
        };
        const handleMove = (e) => {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            updateCoords(x, y);
            if (isPlaying && e.touches) e.preventDefault();
        };

        window.addEventListener('mousedown', handleStart);
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('mouseup', () => isTouching = false);
        window.addEventListener('touchstart', handleStart, { passive: false });
        window.addEventListener('touchmove', handleMove, { passive: false });
        window.addEventListener('touchend', () => isTouching = false);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function startPlay() {
        document.getElementById('ui-root').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('ui-root').style.display = 'none';
            isPlaying = true;
        }, 1000);
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        const wrap = snake.update(t, isTouching, touchWorldPos, dragOffset, isPlaying);
        
        if (wrap) {
            camera.position.add(wrap);
            camFocalPoint.add(wrap);
            touchWorldPos.add(wrap);
            dragOffset.add(wrap);
        }

        const headPos = snake.nodes[0].position;
        const h = 280 + (snake.baseSize * 4);
        const d = 320 + (snake.baseSize * 4);
        const desiredCamPos = headPos.clone().add(new THREE.Vector3(0, h, d));
        
        // FIXED OFFSET CAMERA
        // Lower lerp value makes it feel smoother, higher keeps it tighter.
        // We look directly at the head with no leading offset to prevent the surge.
        camera.position.lerp(desiredCamPos, 0.15);
        camFocalPoint.lerp(headPos, 0.2);
        camera.lookAt(camFocalPoint);

        snow.rotation.y += 0.0006;
        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
