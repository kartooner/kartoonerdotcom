<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nebula Floaties</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face {
            font-family: 'Cartridge';
            src: url('../../assets/fonts/Cartridge-Regular.woff2') format('woff2'),
                 url('../../assets/fonts/Cartridge-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }
        @font-face {
            font-family: 'Cartridge';
            src: url('../../assets/fonts/Cartridge-Rough.woff2') format('woff2'),
                 url('../../assets/fonts/Cartridge-Rough.woff') format('woff');
            font-weight: 900;
            font-style: normal;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: #02050a;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        #ui-root {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; pointer-events: none;
            background: rgba(2, 5, 10, 0.4);
            transition: opacity 1s ease;
        }

        #menu {
            pointer-events: auto; text-align: center; padding: 2rem;
        }

        @keyframes floatSubtitle {
            0%, 100% { transform: translateY(0) rotate(0.5deg); opacity: 0.7; }
            50% { transform: translateY(-10px) rotate(-0.5deg); opacity: 1; }
        }
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0) rotate(-0.5deg); filter: blur(0px); }
            50% { transform: translateY(-12px) rotate(0.5deg); filter: blur(0.8px); }
        }

        .subtitle {
            font-family: 'Cartridge', ui-sans-serif, sans-serif;
            font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.4em; color: #00f2ff;
            font-weight: 800; margin-bottom: 0.75rem;
            animation: floatSubtitle 9s ease-in-out infinite;
            display: inline-block;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.6);
        }
        .title {
            font-family: 'Cartridge', ui-sans-serif, sans-serif;
            font-size: clamp(2.5rem, 8vw, 5.5rem); font-weight: 900; color: #fff; font-style: italic;
            letter-spacing: -0.04em; line-height: 0.9; margin-bottom: 2.5rem;
            text-shadow: 0 0 50px rgba(255, 170, 0, 0.6);
            animation: floatTitle 8s ease-in-out infinite;
            display: block;
        }
        #btn-play {
            font-family: 'Cartridge', ui-sans-serif, sans-serif;
            background: transparent; border: 2.5px solid #00ffcc; color: #00ffcc;
            padding: 1.25rem 4.5rem; font-size: 1.125rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 0.3em; cursor: pointer;
            border-radius: 8px; transition: all 0.4s ease;
            outline: none;
        }
        #btn-play:focus {
            box-shadow: 0 0 0 4px rgba(0, 255, 204, 0.5);
            background: rgba(0, 255, 204, 0.05);
        }
        #btn-play:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            transform: scale(1.02);
        }
        #btn-play:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div id="ui-root" aria-live="polite">
    <div id="menu" role="dialog" aria-labelledby="main-title">
        <div class="subtitle">Primordial Glow</div>
        <h1 class="title" id="main-title">Nebula Floaties</h1>
        <button id="btn-play" onclick="startPlay()" aria-label="Start the simulation">Play</button>
    </div>
</div>

<script>
    let scene, camera, renderer, clock;
    let snake, nutrients = [], snow = [], pillars = [], nebulaClouds = [];
    let worldSize = 2500;
    let isPlaying = false;

    // --- Input state (exclusive: only one mode active at a time) ---
    // Modes: null | 'keyboard' | 'drag' | 'touch' | 'waypoint'
    let inputMode = null;
    let keysDown = new Set();
    let dragWorldPos = new THREE.Vector3();
    let touchWorldPos = new THREE.Vector3();
    let waypointPos = null;
    let camTarget = new THREE.Vector3();

    const PHM_COLORS = [0xffaa00, 0x00f2ff, 0xff00cc, 0x00ffaa, 0x5500ff, 0xff7700];

    function createBackdrop() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 512);
        grad.addColorStop(0, '#332200');
        grad.addColorStop(0.3, '#1a0033');
        grad.addColorStop(0.6, '#001a44');
        grad.addColorStop(1, '#02050a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 512, 512);
        return new THREE.CanvasTexture(canvas);
    }

    class Part {
        constructor(radius, color, opacity, order) {
            const geo = new THREE.IcosahedronGeometry(radius, 1);
            this.mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: opacity,
                depthTest: false
            }));
            this.mesh.renderOrder = order;

            const wire = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
                color: 0xffffff,
                wireframe: true,
                transparent: true,
                opacity: 0.35,
                depthTest: false
            }));
            wire.renderOrder = order + 1;
            this.mesh.add(wire);
            scene.add(this.mesh);
        }
    }

    class Organism {
        constructor() {
            this.nodes = [];
            this.baseSize = 9.0;
            this.segmentCount = 11;
            this.segmentSpacing = 20;   // world-space units between segment centers
            this.minPathDist = 3;       // min distance before adding new path point
            this.swimSpeed = 2.5;
            // Start swimming in -Z (camera is behind at +Z, so snake moves away → nice initial view)
            this.headVelocity = new THREE.Vector3(0, 0, -1);
            this.pathHistory = [];      // world positions, most-recent first

            const headColor = new THREE.Color(0x00f2ff);
            const tailColor = new THREE.Color(0xffaa00);

            for (let i = 0; i < this.segmentCount; i++) {
                const pct = i / this.segmentCount;
                const r = this.baseSize * (1 - pct * 0.9);
                const color = headColor.clone().lerp(tailColor, pct);
                const order = 20000 - i * 10;
                const node = new Part(r, color, i === 0 ? 1.0 : 0.8, order);
                this.nodes.push(node);
            }

            const tGeo = new THREE.ConeGeometry(this.baseSize * 0.25, this.baseSize * 0.7, 3);
            const tMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, depthTest: false });
            this.lJaw = new THREE.Mesh(tGeo, tMat);
            this.lJaw.position.set(this.baseSize * 0.35, 0, this.baseSize * 0.5);
            this.lJaw.rotation.x = Math.PI / 2;
            this.lJaw.renderOrder = 20100;
            this.nodes[0].mesh.add(this.lJaw);

            this.rJaw = this.lJaw.clone();
            this.rJaw.position.x = -this.baseSize * 0.35;
            this.rJaw.renderOrder = 20100;
            this.nodes[0].mesh.add(this.rJaw);

            this._prePopulatePath();
        }

        // Fill path history with a sinuous curve trailing behind the head so the
        // snake starts fully extended instead of collapsed at origin.
        _prePopulatePath() {
            const totalLength = (this.segmentCount + 2) * this.segmentSpacing;
            const numPoints = Math.ceil(totalLength / this.minPathDist) + 10;

            // Head is at (0,0,0) moving in -Z; trail extends in +Z
            for (let i = 0; i < numPoints; i++) {
                const s = i * this.minPathDist;
                this.pathHistory.push(new THREE.Vector3(
                    Math.sin(s * 0.012) * 60,
                    0,
                    s // +Z: behind a -Z-moving head
                ));
            }

            // Position each segment along the pre-populated path
            for (let i = 0; i < this.segmentCount; i++) {
                this.nodes[i].mesh.position.copy(this._samplePath(i * this.segmentSpacing));
            }

            // Orient head
            this.nodes[0].mesh.lookAt(
                this.nodes[0].mesh.position.clone().add(this.headVelocity)
            );
        }

        // Walk path and return interpolated world position at arc-distance `arcDist` from head.
        // Used only during initialization; update() uses the faster single-pass approach.
        _samplePath(arcDist) {
            let acc = 0;
            for (let i = 0; i < this.pathHistory.length - 1; i++) {
                const sl = this.pathHistory[i].distanceTo(this.pathHistory[i + 1]);
                if (acc + sl >= arcDist) {
                    const t = sl > 0 ? (arcDist - acc) / sl : 0;
                    return this.pathHistory[i].clone().lerp(this.pathHistory[i + 1], t);
                }
                acc += sl;
            }
            return this.pathHistory[this.pathHistory.length - 1].clone();
        }

        update(t) {
            const head = this.nodes[0].mesh;

            // ── Steer headVelocity based on active input ──────────────────────────
            if (isPlaying) {
                if (inputMode === 'keyboard') {
                    // Fixed turn rate per frame (camera-relative left/right)
                    const TURN = 0.055; // ~3.15° per frame
                    let dAngle = 0;
                    if (keysDown.has('arrowleft')  || keysDown.has('a')) dAngle -= TURN;
                    if (keysDown.has('arrowright') || keysDown.has('d')) dAngle += TURN;
                    if (dAngle !== 0) {
                        const c = Math.cos(dAngle), s = Math.sin(dAngle);
                        const nx = this.headVelocity.x * c - this.headVelocity.z * s;
                        const nz = this.headVelocity.x * s + this.headVelocity.z * c;
                        this.headVelocity.set(nx, 0, nz).normalize();
                    }
                } else if (inputMode === 'drag' || inputMode === 'touch') {
                    const wp = inputMode === 'drag' ? dragWorldPos : touchWorldPos;
                    const toTarget = new THREE.Vector3().subVectors(wp, head.position);
                    toTarget.y = 0;
                    if (toTarget.length() > 20) {
                        this.headVelocity.lerp(toTarget.normalize(), 0.14).normalize();
                    }
                } else if (inputMode === 'waypoint' && waypointPos) {
                    const toTarget = new THREE.Vector3().subVectors(waypointPos, head.position);
                    toTarget.y = 0;
                    if (toTarget.length() < 40) {
                        waypointPos = null;
                        inputMode = null;
                    } else {
                        this.headVelocity.lerp(toTarget.normalize(), 0.08).normalize();
                    }
                }
                // else: no input — coast forward in current direction
            } else {
                // Idle (title screen): gentle sinuous drift — slow, wide curves
                const lateral = Math.sin(t * 0.28) * 0.002;
                const right = new THREE.Vector3(-this.headVelocity.z, 0, this.headVelocity.x);
                this.headVelocity.addScaledVector(right, lateral).normalize();
            }

            // ── Speed control: W boosts, S slows, else cruise ────────────────────
            const isBoost = inputMode === 'keyboard' && (keysDown.has('w') || keysDown.has('arrowup'));
            const isBrake = inputMode === 'keyboard' && (keysDown.has('s') || keysDown.has('arrowdown'));
            const targetSpeed = isBoost ? 5.5 : isBrake ? 0.8 : 2.5;
            this.swimSpeed += (targetSpeed - this.swimSpeed) * 0.08;
            this.isBoosting = isBoost;

            // ── Always propel forward ─────────────────────────────────────────────
            head.position.addScaledVector(this.headVelocity, this.swimSpeed);

            // ── World wrap ────────────────────────────────────────────────────────
            const b = worldSize / 2;
            const wrap = new THREE.Vector3();
            if (head.position.x >  b) wrap.x = -worldSize;
            if (head.position.x < -b) wrap.x =  worldSize;
            if (head.position.z >  b) wrap.z = -worldSize;
            if (head.position.z < -b) wrap.z =  worldSize;
            if (wrap.length() > 0) {
                head.position.add(wrap);
                for (let i = 1; i < this.nodes.length; i++) this.nodes[i].mesh.position.add(wrap);
                for (const p of this.pathHistory) p.add(wrap);
                camera.position.add(wrap);
                camTarget.add(wrap);
                if (waypointPos) waypointPos.add(wrap);
                dragWorldPos.add(wrap);
                touchWorldPos.add(wrap);
            }

            // ── Body undulation: drive head Y so the whole snake ripples via path ──
            head.position.y = Math.sin(t * 3.5) * 7;

            // ── Orient head: face forward with subtle pitch from undulation ────────
            const pitchY = Math.cos(t * 3.5) * 0.18;
            const lookDir = new THREE.Vector3(this.headVelocity.x, pitchY, this.headVelocity.z).normalize();
            head.lookAt(head.position.clone().add(lookDir));

            // ── Record path point (distance-gated, not every frame) ───────────────
            if (!this.pathHistory.length ||
                head.position.distanceTo(this.pathHistory[0]) >= this.minPathDist) {
                this.pathHistory.unshift(head.position.clone());
                const maxLen = Math.ceil(this.segmentCount * this.segmentSpacing / this.minPathDist) + 20;
                if (this.pathHistory.length > maxLen) this.pathHistory.length = maxLen;
            }

            // ── Place body segments – single O(n+m) pass ──────────────────────────
            // Walk pathHistory once, placing each segment at its arc-distance target.
            let accumulated = 0;
            let pi = 0;
            for (let i = 1; i < this.nodes.length; i++) {
                const target = i * this.segmentSpacing;

                // Advance path index until we bracket 'target'
                while (pi < this.pathHistory.length - 1) {
                    const sl = this.pathHistory[pi].distanceTo(this.pathHistory[pi + 1]);
                    if (accumulated + sl >= target) break;
                    accumulated += sl;
                    pi++;
                }
                if (pi >= this.pathHistory.length - 1) break;

                const sl = this.pathHistory[pi].distanceTo(this.pathHistory[pi + 1]);
                const frac = sl > 0 ? Math.min(1, (target - accumulated) / sl) : 0;
                const pos = this.pathHistory[pi].clone().lerp(this.pathHistory[pi + 1], frac);
                const seg = this.nodes[i].mesh;
                seg.position.copy(pos);

                // Orient segment toward the segment ahead of it
                const prevPos = i === 1 ? head.position : this.nodes[i - 1].mesh.position;
                const dir = new THREE.Vector3().subVectors(prevPos, seg.position);
                if (dir.lengthSq() > 0.001) {
                    const q = new THREE.Quaternion().setFromUnitVectors(
                        new THREE.Vector3(0, 0, 1), dir.normalize()
                    );
                    seg.quaternion.slerp(q, 0.4);
                }
            }

            // ── Jaw animation ────────────────────────────────────────────────────
            const snap = (Math.sin(t * 12) + 1) * 0.5;
            this.lJaw.rotation.z =  snap * 0.8;
            this.rJaw.rotation.z = -snap * 0.8;
        }

        grow(n) {
            this.baseSize += n;
            const s = 1 + (this.baseSize - 9.0) * 0.08;
            this.nodes.forEach(node => node.mesh.scale.setScalar(s));
            this.segmentSpacing = 20 * s;
        }
    }

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        scene.fog = new THREE.FogExp2(0x02050a, 0.0006);

        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 20000);
        // Will be overridden after snake is created; placeholder until then
        camera.position.set(0, 280, 400);
        camera.up.set(0, 1, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setClearColor(0x02050a, 1);
        document.body.appendChild(renderer.domElement);

        const background = new THREE.Mesh(
            new THREE.SphereGeometry(18000, 32, 32),
            new THREE.MeshBasicMaterial({ map: createBackdrop(), side: THREE.BackSide, depthWrite: false })
        );
        background.renderOrder = -100;
        scene.add(background);

        const corners = [
            { pos: [1, 1],   col: 0xffaa00 },
            { pos: [-1, 1],  col: 0x00f2ff },
            { pos: [1, -1],  col: 0xff0066 },
            { pos: [-1, -1], col: 0x00ffaa },
            { pos: [0, 1.5], col: 0xffaa00 },
            { pos: [0, -1.5],col: 0x5500ff }
        ];

        corners.forEach(corner => {
            const size = 3000 + Math.random() * 2000;
            const glowGeo = new THREE.SphereGeometry(size, 16, 16);
            const glowMat = new THREE.MeshBasicMaterial({
                color: corner.col, transparent: true, opacity: 0.12,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            glow.position.set(corner.pos[0] * worldSize, 0, corner.pos[1] * worldSize);
            scene.add(glow);
        });

        for (let i = 0; i < 50; i++) {
            const size = 1500 + Math.random() * 3000;
            const cloudGeo = new THREE.SphereGeometry(size, 12, 12);
            const cloudMat = new THREE.MeshBasicMaterial({
                color: PHM_COLORS[Math.floor(Math.random() * PHM_COLORS.length)],
                transparent: true, opacity: 0.1,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            cloud.position.set(
                (Math.random()-0.5)*worldSize*8,
                (Math.random()-0.5)*3000,
                (Math.random()-0.5)*worldSize*8
            );
            scene.add(cloud);
            nebulaClouds.push(cloud);
        }

        for (let i = 0; i < 25; i++) {
            const pGeo = new THREE.CylinderGeometry(150, 600, 12000, 12);
            const pMat = new THREE.MeshBasicMaterial({
                color: PHM_COLORS[Math.floor(Math.random()*PHM_COLORS.length)],
                transparent: true, opacity: 0.1,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            const pillar = new THREE.Mesh(pGeo, pMat);
            pillar.position.set(
                (Math.random()-0.5)*worldSize*9,
                0,
                (Math.random()-0.5)*worldSize*9
            );
            pillar.rotation.z = (Math.random()-0.5) * 3.14;
            scene.add(pillar);
            pillars.push(pillar);
        }

        const snowGeo = new THREE.BufferGeometry();
        const snowCount = 4000;
        const snowPos  = new Float32Array(snowCount * 3);
        const snowCols = new Float32Array(snowCount * 3);
        for (let i = 0; i < snowCount; i++) {
            snowPos[i*3]   = (Math.random()-0.5) * worldSize * 8;
            snowPos[i*3+1] = (Math.random()-0.5) * 3000;
            snowPos[i*3+2] = (Math.random()-0.5) * worldSize * 8;
            const c = new THREE.Color(PHM_COLORS[Math.floor(Math.random()*PHM_COLORS.length)]);
            snowCols[i*3] = c.r; snowCols[i*3+1] = c.g; snowCols[i*3+2] = c.b;
        }
        snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
        snowGeo.setAttribute('color',    new THREE.BufferAttribute(snowCols, 3));
        const snowMat = new THREE.PointsMaterial({
            vertexColors: true, size: 10,
            transparent: true, opacity: 0.8,
            depthWrite: false, blending: THREE.AdditiveBlending
        });
        const snowSystem = new THREE.Points(snowGeo, snowMat);
        scene.add(snowSystem);
        snow.push(snowSystem);

        snake = new Organism();
        spawnNutrients();

        // Position camera behind snake's initial heading
        const initBehind = snake.headVelocity.clone().negate().multiplyScalar(400);
        camera.position.set(initBehind.x, 280, initBehind.z);
        camTarget.copy(snake.nodes[0].mesh.position);

        // ── Raycaster (shared by all pointer inputs) ───────────────────────────────
        const rc = new THREE.Raycaster();
        const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

        function screenToWorld(x, y, out) {
            const ndc = new THREE.Vector2(
                (x / window.innerWidth)  *  2 - 1,
                (y / window.innerHeight) * -2 + 1
            );
            rc.setFromCamera(ndc, camera);
            rc.ray.intersectPlane(groundPlane, out);
        }

        // Returns true if the given mode can become active.
        // 'drag' / 'touch' are "hard" inputs that block each other and keyboard.
        // 'keyboard' blocks drag/touch.
        // 'waypoint' (soft) is overridden by anything.
        function canActivate(mode) {
            if (!inputMode || inputMode === mode) return true;
            if (inputMode === 'waypoint') return true; // soft — always overrideable
            return false;
        }

        function activateMode(mode) {
            if (inputMode === 'waypoint') { waypointPos = null; }
            inputMode = mode;
        }

        // ── Keyboard ──────────────────────────────────────────────────────────────
        const STEER_KEYS = new Set(['arrowleft','arrowright','arrowup','arrowdown','w','a','s','d']);

        window.addEventListener('keydown', (e) => {
            if (!isPlaying) return;
            const key = e.key.toLowerCase();
            if (!STEER_KEYS.has(key)) return;
            if (!canActivate('keyboard')) return;
            e.preventDefault();
            activateMode('keyboard');
            keysDown.add(key);
        });

        window.addEventListener('keyup', (e) => {
            keysDown.delete(e.key.toLowerCase());
            if (inputMode === 'keyboard' && keysDown.size === 0) inputMode = null;
        });

        // ── Mouse ─────────────────────────────────────────────────────────────────
        let mouseDownAt  = null;
        let isDragging   = false;
        const DRAG_THRESHOLD = 6;

        window.addEventListener('mousedown', (e) => {
            if (!isPlaying) return;
            if (!canActivate('drag')) return;
            mouseDownAt = { x: e.clientX, y: e.clientY };
            isDragging = false;
        });

        window.addEventListener('mousemove', (e) => {
            if (!mouseDownAt) return;
            if (!isDragging) {
                const dx = e.clientX - mouseDownAt.x;
                const dy = e.clientY - mouseDownAt.y;
                if (Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD) {
                    if (!canActivate('drag')) { mouseDownAt = null; return; }
                    isDragging = true;
                    activateMode('drag');
                    screenToWorld(mouseDownAt.x, mouseDownAt.y, dragWorldPos);
                }
            }
            if (isDragging) screenToWorld(e.clientX, e.clientY, dragWorldPos);
        });

        window.addEventListener('mouseup', (e) => {
            if (!mouseDownAt) return;
            const wasDrag = isDragging;
            isDragging = false;
            if (inputMode === 'drag') inputMode = null;

            if (!wasDrag && isPlaying && canActivate('drag')) {
                // Click → waypoint navigation
                const wp = new THREE.Vector3();
                screenToWorld(e.clientX, e.clientY, wp);
                waypointPos = wp;
                activateMode('waypoint');
            }
            mouseDownAt = null;
        });

        // ── Touch ─────────────────────────────────────────────────────────────────
        window.addEventListener('touchstart', (e) => {
            if (!isPlaying) return;
            if (!canActivate('touch')) return;
            activateMode('touch');
            screenToWorld(e.touches[0].clientX, e.touches[0].clientY, touchWorldPos);
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (inputMode !== 'touch') return;
            screenToWorld(e.touches[0].clientX, e.touches[0].clientY, touchWorldPos);
            e.preventDefault();
        }, { passive: false });

        window.addEventListener('touchend', () => {
            if (inputMode === 'touch') inputMode = null;
        }, { passive: true });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    }

    function spawnNutrients() {
        for (let i = 0; i < 300; i++) {
            const b = new THREE.Mesh(
                new THREE.TetrahedronGeometry(11, 0),
                new THREE.MeshBasicMaterial({
                    color: 0x00ffcc, wireframe: true,
                    transparent: true, opacity: 1, depthWrite: false
                })
            );
            b.position.set((Math.random()-0.5)*worldSize, 0, (Math.random()-0.5)*worldSize);
            b.renderOrder = 500;
            scene.add(b);
            nutrients.push(b);
        }
    }

    function startPlay() {
        const ui = document.getElementById('ui-root');
        ui.style.opacity = '0';
        setTimeout(() => {
            ui.style.display = 'none';
            inputMode = null;
            isPlaying = true;
        }, 1000);
    }

    function animate() {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        snake.update(t);

        const headPos = snake.nodes[0].mesh.position;
        const h = 280 + snake.baseSize * 3;
        const d = 420 + snake.baseSize * 3;

        // Chase camera: stay behind the snake's direction of travel
        const behind = snake.headVelocity.clone().negate().multiplyScalar(d);
        const desiredCamPos = headPos.clone().add(behind).add(new THREE.Vector3(0, h, 0));
        camera.position.lerp(desiredCamPos, 0.08);

        // Look slightly ahead of the head for a more dynamic feel
        const lookAhead = headPos.clone().addScaledVector(snake.headVelocity, 100);
        camTarget.lerp(lookAhead, 0.10);
        camera.lookAt(camTarget);

        // FOV widens on boost for speed feel
        const targetFov = snake.isBoosting ? 66 : 50;
        camera.fov += (targetFov - camera.fov) * 0.06;
        camera.updateProjectionMatrix();

        snow.forEach(sys => {
            sys.rotation.y += 0.0012;
            sys.position.y = Math.sin(t * 0.05) * 80;
        });

        if (isPlaying) {
            nutrients.forEach((f, i) => {
                if (f.position.distanceTo(headPos) < snake.baseSize + 15.0) {
                    scene.remove(f);
                    nutrients.splice(i, 1);
                    const b = new THREE.Mesh(
                        new THREE.TetrahedronGeometry(11, 0),
                        new THREE.MeshBasicMaterial({
                            color: 0x00ffcc, wireframe: true,
                            transparent: true, opacity: 1, depthWrite: false
                        })
                    );
                    b.position.set((Math.random()-0.5)*worldSize, 0, (Math.random()-0.5)*worldSize);
                    b.renderOrder = 500;
                    scene.add(b);
                    nutrients.push(b);
                }
            });
        }

        renderer.render(scene, camera);
    }

    init();
</script>
</body>
</html>
